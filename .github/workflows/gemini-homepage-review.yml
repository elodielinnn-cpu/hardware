name: Gemini homepage quality review

on:
  workflow_dispatch:
  schedule:
    # Beijing 08:30 and 14:30 (UTC 00:30 and 06:30).
    - cron: "30 0,6 * * *"

permissions:
  contents: read

concurrency:
  group: gemini-homepage-quality-review-${{ github.ref }}
  cancel-in-progress: false

env:
  GEMINI_REVIEW_OUTPUT_DIR: outputs/gemini-homepage-review
  GEMINI_REVIEW_CANDIDATES_PATH: outputs/gemini-homepage-review/candidates.json
  GEMINI_REVIEW_STORE_PATH: outputs/gemini-homepage-review/latest.json
  MAX_REVIEW_CANDIDATES: "12"
  GEMINI_ARTICLE_TIMEOUT_MS: "45000"
  GEMINI_RUN_INPUT_TOKEN_BUDGET: "50000"
  GEMINI_RUN_OUTPUT_TOKEN_BUDGET: "3000"

jobs:
  review:
    name: Review latest published V3 homepage candidates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest committed snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore prior Gemini review cache
        id: review-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: outputs/gemini-homepage-review/latest.json
          key: gemini-homepage-review-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gemini-homepage-review-v1-

      - name: Validate integration and select incremental candidates
        run: |
          set -euo pipefail
          node --check experiments/gemini-homepage-review/cache.mjs
          node --check experiments/gemini-homepage-review/prepare-candidates.mjs
          node --check experiments/gemini-homepage-review/run-review.mjs
          node experiments/gemini-homepage-review/test-integration.mjs
          node experiments/gemini-homepage-review/prepare-candidates.mjs

      - name: Run Gemini shadow review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/gemini-homepage-review/run-review.mjs

      - name: Summarize shadow review
        if: ${{ always() }}
        continue-on-error: true
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const path = "outputs/gemini-homepage-review/run-result.json";
          console.log("## Gemini homepage quality review (shadow mode)\n");
          if (!fs.existsSync(path)) {
            console.log("No run report was produced. The V3 homepage remains unchanged.");
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          console.log(`- Snapshot: ${report.sourceGeneration?.generatedAt || "not available"}`);
          console.log(`- Model: ${report.actualModelIds.join(", ") || report.configuredModelId}`);
          console.log(`- Selected/completed/failed/deferred: ${report.summary.selected}/${report.summary.completed}/${report.summary.failed}/${report.summary.deferred}`);
          console.log(`- Requests/input tokens/output tokens: ${report.usage.requests}/${report.usage.inputTokens}/${report.usage.outputTokens}`);
          console.log(`- Raw/validated HIDE suggestions: ${report.summary.shadowHideSuggestions}/${report.summary.validatedHideSuggestions}`);
          console.log(`- Provider stopped: ${report.summary.providerStopped}`);
          console.log("\nThis workflow is shadow-only and never changes production homepage data.");
          NODE

      - name: Save review cache for the next run
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: outputs/gemini-homepage-review/latest.json
          key: gemini-homepage-review-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload non-secret review diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gemini-homepage-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/gemini-homepage-review/candidates.json
            outputs/gemini-homepage-review/run-result.json
          if-no-files-found: warn
          retention-days: 14
