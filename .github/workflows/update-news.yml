name: Update news data

on:
  workflow_dispatch:
  schedule:
    # Run hourly on an off-peak minute. GitHub scheduled jobs can start a few minutes late.
    - cron: "17 * * * *"

concurrency:
  group: update-news-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest news
        run: node scripts/fetch_real_sources.mjs

      - name: Sync static publish directory
        run: |
          cp real-data.js taxonomy.js site/

      - name: Bust static asset cache
        run: node scripts/update_asset_versions.mjs

      - name: Validate generated data
        run: node scripts/validate_generated_data.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add real-data.js taxonomy.js index.html site/real-data.js site/taxonomy.js site/index.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update news data"

          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt), rebasing onto latest remote..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
          done

          git push
