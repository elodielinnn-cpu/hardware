name: Update news data

on:
  workflow_dispatch:
  schedule:
    # Run hourly on an off-peak minute. GitHub scheduled jobs can start a few minutes late.
    - cron: "17 * * * *"

concurrency:
  group: update-news-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate, validate, and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Update attempt ${attempt}/3"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            node scripts/fetch_real_sources.mjs
            cp real-data.js taxonomy.js site/
            node scripts/update_asset_versions.mjs
            node scripts/validate_generated_data.mjs

            git add real-data.js taxonomy.js index.html site/real-data.js site/taxonomy.js site/index.html

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Update news data"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "push rejected (attempt ${attempt}), retrying from latest remote..."
          done

          echo "Failed to push updated news data after 3 attempts" >&2
          exit 1

      - name: Summarize source funnel diagnostics
        if: always()
        continue-on-error: true
        run: |
          if [ ! -s outputs/news-source-funnel/latest.json ]; then
            echo "## Source funnel diagnostics" >> "$GITHUB_STEP_SUMMARY"
            echo "No diagnostic file was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const report = require("./outputs/news-source-funnel/latest.json");
            const lines = [
              "## Source funnel diagnostics",
              "",
              `Generated: ${report.generatedAt || "unknown"}`,
              "",
              "| Source | Status | Raw | Retained | Default |",
              "| --- | --- | ---: | ---: | ---: |",
              ...(report.sourceMetrics || []).map((item) => `| ${item.sourceName || item.sourceId} | ${item.status || "unknown"} | ${item.rawParsed ?? "N/A"} | ${item.retained ?? "N/A"} | ${item.defaultVisible ?? "N/A"} |`)
            ];
            process.stdout.write(lines.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source funnel diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: news-source-funnel-${{ github.run_id }}
          path: outputs/news-source-funnel/latest.json
          if-no-files-found: warn
          retention-days: 14
