name: Qwen3-8B offline news evaluation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Evaluation scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
      knowledge_mode:
        description: Model context for this run
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - business_profile

permissions:
  contents: read
  actions: read

concurrency:
  group: qwen-8b-offline-news-${{ github.event.inputs.scope || 'smoke' }}-${{ github.event.inputs.knowledge_mode || 'baseline' }}
  cancel-in-progress: false

env:
  LLAMA_REF: b11905
  MODEL_NAME: Qwen3-8B-Q4_K_M.gguf
  MODEL_URL: https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf
  MODEL_SHA256: d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785
  MODEL_ID: Qwen/Qwen3-8B-GGUF:Q4_K_M
  BASELINE_INFERENCE_PROFILE: ctx4096-t4-tb4-p1-b128-ub128-temp0-max900-thinking0-timeout300000-retry0
  BUSINESS_PROFILE_INFERENCE_PROFILE: ctx8192-t4-tb4-p1-b128-ub128-temp0-max900-thinking0-timeout300000-retry0
  SMOKE_CASE_IDS: high-04-apple-manufacturing,hide-06-office-promotion
  BASELINE_RUN_ID: "40644621847"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      case_ids: ${{ steps.plan.outputs.case_ids }}
      case_count: ${{ steps.plan.outputs.case_count }}
      context_size: ${{ steps.plan.outputs.context_size }}
      inference_profile: ${{ steps.plan.outputs.inference_profile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify evaluation harness
        run: |
          node --check experiments/qwen-news-semantic-eval/run-eval.mjs
          node --check experiments/qwen-news-semantic-eval/validate-results.mjs
          node --check experiments/qwen-news-semantic-eval/plan-batches.mjs
          node --check experiments/qwen-news-semantic-eval/merge-results.mjs
          node --check experiments/qwen-news-semantic-eval/build-business-profile-context.mjs
          node --check experiments/qwen-news-semantic-eval/prepare-historical-baseline.mjs
          node --check experiments/qwen-news-semantic-eval/compare-business-profile-ab.mjs
          node experiments/qwen-news-semantic-eval/test-harness.mjs
          node experiments/qwen-news-semantic-eval/test-batch-tools.mjs
          node experiments/qwen-news-semantic-eval/test-business-profile-context.mjs

      - name: Plan evaluation batches
        id: plan
        env:
          EVAL_MODE: ${{ github.event.inputs.scope || 'smoke' }}
          KNOWLEDGE_MODE: ${{ github.event.inputs.knowledge_mode || 'baseline' }}
          BASELINE_PROFILE: ${{ env.BASELINE_INFERENCE_PROFILE }}
          BUSINESS_PROFILE: ${{ env.BUSINESS_PROFILE_INFERENCE_PROFILE }}
          BATCH_SIZE: "5"
        run: |
          PLAN_JSON=$(node experiments/qwen-news-semantic-eval/plan-batches.mjs)
          echo "matrix=$(jq -c '.matrix' <<< "$PLAN_JSON")" >> "$GITHUB_OUTPUT"
          echo "case_ids=$(jq -r '.caseIds | join(",")' <<< "$PLAN_JSON")" >> "$GITHUB_OUTPUT"
          echo "case_count=$(jq -r '.caseIds | length' <<< "$PLAN_JSON")" >> "$GITHUB_OUTPUT"
          if [[ "$KNOWLEDGE_MODE" == "business_profile" ]]; then
            echo "context_size=8192" >> "$GITHUB_OUTPUT"
            echo "inference_profile=$BUSINESS_PROFILE" >> "$GITHUB_OUTPUT"
          else
            echo "context_size=4096" >> "$GITHUB_OUTPUT"
            echo "inference_profile=$BASELINE_PROFILE" >> "$GITHUB_OUTPUT"
          fi
          echo "Planned $(jq -r '.caseIds | length' <<< "$PLAN_JSON") cases in $(jq -r '.matrix.include | length' <<< "$PLAN_JSON") batch(es)."

  evaluate:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BATCH_RESULT_DIR: experiments/qwen-news-semantic-eval/results/8b-${{ github.event.inputs.scope || 'smoke' }}-${{ github.event.inputs.knowledge_mode || 'baseline' }}/${{ matrix.batchId }}
      BATCH_CASE_IDS: ${{ matrix.caseIds }}
      CONTEXT_SIZE: ${{ needs.plan.outputs.context_size }}
      ACTIVE_INFERENCE_PROFILE: ${{ needs.plan.outputs.inference_profile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build compact Luxshare business profile context
        if: github.event.inputs.knowledge_mode == 'business_profile'
        env:
          BUSINESS_PROFILE_CONTEXT_OUTPUT: ${{ runner.temp }}/luxshare-business-profile-context.txt
          BUSINESS_PROFILE_MANIFEST_OUTPUT: ${{ runner.temp }}/luxshare-business-profile-context.json
          MAX_CONTEXT_TOKENS: ${{ env.CONTEXT_SIZE }}
          MAX_OUTPUT_TOKENS: "900"
        run: |
          node experiments/qwen-news-semantic-eval/build-business-profile-context.mjs
          echo "BUSINESS_PROFILE_CONTEXT_PATH=$BUSINESS_PROFILE_CONTEXT_OUTPUT" >> "$GITHUB_ENV"
          echo "BUSINESS_PROFILE_MANIFEST_PATH=$BUSINESS_PROFILE_MANIFEST_OUTPUT" >> "$GITHUB_ENV"

      - name: Restore completed batch result
        id: result-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BATCH_RESULT_DIR }}
          key: qwen-8b-result-${{ github.event.inputs.knowledge_mode || 'baseline' }}-${{ env.MODEL_SHA256 }}-${{ env.LLAMA_REF }}-${{ env.ACTIVE_INFERENCE_PROFILE }}-${{ matrix.batchId }}-${{ hashFiles('.github/workflows/qwen-offline-smoke-8b.yml', 'experiments/qwen-news-semantic-eval/cases.json', 'experiments/qwen-news-semantic-eval/system-prompt.txt', 'experiments/qwen-news-semantic-eval/response.schema.json', 'experiments/qwen-news-semantic-eval/run-eval.mjs', 'experiments/qwen-news-semantic-eval/build-business-profile-context.mjs', 'config/luxshare-business-profile.json') }}

      - name: Verify cached batch
        if: steps.result-cache.outputs.cache-hit == 'true'
        env:
          RESULT_PATH: ${{ env.BATCH_RESULT_DIR }}/model-output.json
          EXPECTED_GROUP: ${{ github.event.inputs.knowledge_mode || 'baseline' }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, "utf8"));
          const expected = process.env.BATCH_CASE_IDS.split(",");
          if (payload.model !== process.env.MODEL_ID) throw new Error("Cached model id does not match");
          if (payload.experimentGroup !== process.env.EXPECTED_GROUP) {
            throw new Error(`Cached experiment group does not match: ${payload.experimentGroup}`);
          }
          if (JSON.stringify(payload.caseIds) !== JSON.stringify(expected)) {
            throw new Error(`Cached case ids do not match: ${payload.caseIds}`);
          }
          if (payload.results?.some((item) => item.error || !item.result)) {
            throw new Error("Cached batch contains an incomplete result");
          }
          console.log(`Using ${payload.results.length} completed cached results`);
          NODE
      - name: Record runner resources
        if: steps.result-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BATCH_RESULT_DIR"
          {
            lscpu
            free -h
            df -h / "$RUNNER_TEMP"
          } > "$BATCH_RESULT_DIR/runner-resources.txt"

          AVAILABLE_KB=$(awk '/MemAvailable:/ { print $2 }' /proc/meminfo)
          FREE_DISK_KB=$(df --output=avail -k "$RUNNER_TEMP" | tail -1 | tr -d ' ')
          if (( AVAILABLE_KB < 10485760 )); then
            echo "At least 10 GiB of available memory is required; found ${AVAILABLE_KB} KiB" \
              | tee "$BATCH_RESULT_DIR/resource-error.txt" >&2
            exit 1
          fi
          if (( FREE_DISK_KB < 12582912 )); then
            echo "At least 12 GiB of free disk is required; found ${FREE_DISK_KB} KiB" \
              | tee "$BATCH_RESULT_DIR/resource-error.txt" >&2
            exit 1
          fi

      - name: Cache pinned llama.cpp build
        if: steps.result-cache.outputs.cache-hit != 'true'
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llama.cpp
          key: llama-cpp-${{ runner.os }}-${{ runner.arch }}-${{ env.LLAMA_REF }}

      - name: Build pinned llama.cpp CPU server
        if: steps.result-cache.outputs.cache-hit != 'true' && steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          {
            git clone --depth 1 --branch "$LLAMA_REF" \
              https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
            cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=OFF \
              -DGGML_OPENMP=ON \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_TOOLS=ON
            cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release \
              --target llama-server --parallel 4
          } 2>&1 | tee "$BATCH_RESULT_DIR/llama-build.log"

      - name: Locate llama.cpp server
        if: steps.result-cache.outputs.cache-hit != 'true'
        run: |
          LLAMA_SERVER="$RUNNER_TEMP/llama.cpp/build/bin/llama-server"
          test -x "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"

      - name: Cache verified Qwen model
        if: steps.result-cache.outputs.cache-hit != 'true'
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models/${{ env.MODEL_NAME }}
          key: qwen-model-${{ env.MODEL_SHA256 }}

      - name: Download Qwen model from official repository
        if: steps.result-cache.outputs.cache-hit != 'true' && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl --fail --location --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 1200 \
            --output "$RUNNER_TEMP/models/$MODEL_NAME" "$MODEL_URL" \
            2>&1 | tee "$BATCH_RESULT_DIR/model-download.log"

      - name: Verify Qwen model
        if: steps.result-cache.outputs.cache-hit != 'true'
        run: |
          echo "$MODEL_SHA256  $RUNNER_TEMP/models/$MODEL_NAME" | sha256sum --check --strict
          echo "MODEL_PATH=$RUNNER_TEMP/models/$MODEL_NAME" >> "$GITHUB_ENV"

      - name: Record execution metadata
        run: |
          mkdir -p "$BATCH_RESULT_DIR"
          node - <<'NODE'
          const fs = require("node:fs");
          const metadata = {
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            commit: process.env.GITHUB_SHA,
            scope: process.env.GITHUB_EVENT_NAME === "workflow_dispatch" ? process.env.EVAL_SCOPE : "smoke",
            batchId: process.env.BATCH_ID,
            caseIds: process.env.BATCH_CASE_IDS.split(","),
            model: process.env.MODEL_ID,
            modelFile: process.env.MODEL_NAME,
            modelSha256: process.env.MODEL_SHA256,
            llamaRef: process.env.LLAMA_REF,
            experimentGroup: process.env.EXPERIMENT_GROUP,
            contextSize: Number(process.env.CONTEXT_SIZE),
            inferenceProfile: process.env.ACTIVE_INFERENCE_PROFILE,
            resultCacheHit: process.env.RESULT_CACHE_HIT === "true"
          };
          if (process.env.BUSINESS_PROFILE_MANIFEST_PATH) {
            metadata.businessProfile = JSON.parse(fs.readFileSync(process.env.BUSINESS_PROFILE_MANIFEST_PATH, "utf8"));
            fs.copyFileSync(
              process.env.BUSINESS_PROFILE_MANIFEST_PATH,
              `${process.env.BATCH_RESULT_DIR}/business-profile-context.json`
            );
          }
          fs.writeFileSync(`${process.env.BATCH_RESULT_DIR}/execution-metadata.json`, `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
        env:
          EVAL_SCOPE: ${{ github.event.inputs.scope || 'smoke' }}
          BATCH_ID: ${{ matrix.batchId }}
          RESULT_CACHE_HIT: ${{ steps.result-cache.outputs.cache-hit }}
          EXPERIMENT_GROUP: ${{ github.event.inputs.knowledge_mode || 'baseline' }}
          CONTEXT_SIZE: ${{ env.CONTEXT_SIZE }}
          ACTIVE_INFERENCE_PROFILE: ${{ env.ACTIVE_INFERENCE_PROFILE }}

      - name: Run isolated batch inference
        if: steps.result-cache.outputs.cache-hit != 'true'
        id: inference
        run: |
          set -uo pipefail
          RESULT_PATH="$GITHUB_WORKSPACE/$BATCH_RESULT_DIR/model-output.json"
          ARTICLE_RESULT_DIR="$GITHUB_WORKSPACE/$BATCH_RESULT_DIR/articles"
          METRICS_PATH="$GITHUB_WORKSPACE/$BATCH_RESULT_DIR/runtime-metrics.json"
          SERVER_LOG="$GITHUB_WORKSPACE/$BATCH_RESULT_DIR/llama-server.log"
          mkdir -p "$ARTICLE_RESULT_DIR"

          START_MS=$(date +%s%3N)
          PEAK_RSS_KB=0
          "$LLAMA_SERVER" \
            --model "$MODEL_PATH" \
            --alias "$MODEL_ID" \
            --host 127.0.0.1 --port 8080 \
            --ctx-size "$CONTEXT_SIZE" --threads 4 --threads-batch 4 --parallel 1 \
            --batch-size 128 --ubatch-size 128 \
            --jinja > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!

          cleanup() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          sample_rss() {
            local rss
            rss=$(ps -o rss= -p "$SERVER_PID" 2>/dev/null | tr -d ' ' || true)
            if [[ "$rss" =~ ^[0-9]+$ ]] && (( rss > PEAK_RSS_KB )); then
              PEAK_RSS_KB=$rss
            fi
          }

          READY=0
          for _ in $(seq 1 180); do
            sample_rss
            if curl --silent --fail http://127.0.0.1:8080/health > "$BATCH_RESULT_DIR/health.json"; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done

          LOAD_MS=$(( $(date +%s%3N) - START_MS ))
          if (( READY == 0 )); then
            echo "llama-server did not become ready" | tee "$BATCH_RESULT_DIR/server-start-error.txt" >&2
            exit 1
          fi

          export MODEL="$MODEL_ID" CASE_IDS="$BATCH_CASE_IDS" RESULT_PATH ARTICLE_RESULT_DIR
          export EXPERIMENT_GROUP="${{ github.event.inputs.knowledge_mode || 'baseline' }}"
          export ARTICLE_TIMEOUT_MS=300000 MAX_RETRIES=0
          node experiments/qwen-news-semantic-eval/run-eval.mjs &
          EVAL_PID=$!
          while kill -0 "$EVAL_PID" 2>/dev/null; do
            sample_rss
            sleep 1
          done
          set +e
          wait "$EVAL_PID"
          RUN_EXIT=$?
          set -e
          sample_rss
          cleanup
          trap - EXIT

          STATUS=completed
          if (( RUN_EXIT != 0 )); then STATUS=completed_with_article_errors; fi
          STATUS="$STATUS" LOAD_MS="$LOAD_MS" PEAK_RSS_KB="$PEAK_RSS_KB" \
            RUN_EXIT="$RUN_EXIT" RESULT_PATH="$RESULT_PATH" METRICS_PATH="$METRICS_PATH" \
            node - <<'NODE'
          const fs = require("node:fs");
          let results = [];
          try { results = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, "utf8")).results || []; } catch {}
          fs.writeFileSync(process.env.METRICS_PATH, `${JSON.stringify({
            status: process.env.STATUS,
            modelLoadMs: Number(process.env.LOAD_MS),
            peakServerRssKb: Number(process.env.PEAK_RSS_KB),
            inferenceExitCode: Number(process.env.RUN_EXIT),
            articles: results.map(({ id, elapsedMs, usage, error }) => ({ id, elapsedMs, usage, error: error || null }))
          }, null, 2)}\n`);
          NODE
          echo "run_exit=$RUN_EXIT" >> "$GITHUB_OUTPUT"

      - name: Validate batch results
        env:
          RESULT_PATH: ${{ env.BATCH_RESULT_DIR }}/model-output.json
          EVALUATION_PATH: ${{ env.BATCH_RESULT_DIR }}/evaluation.json
        run: |
          rm -f "$EVALUATION_PATH"
          node experiments/qwen-news-semantic-eval/validate-results.mjs

      - name: Summarize batch result
        if: always()
        continue-on-error: true
        run: |
          echo "## Qwen3-8B ${{ matrix.batchId }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: ${{ github.event.inputs.scope || 'smoke' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Knowledge mode: ${{ github.event.inputs.knowledge_mode || 'baseline' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cases: ${{ matrix.caseCount }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result cache hit: ${{ steps.result-cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$BATCH_RESULT_DIR/evaluation.json" ]; then
            node -e '
              const fs = require("node:fs");
              const { summary, metrics } = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              console.log(`- Schema valid: ${summary.schemaValid}/${summary.expected}`);
              console.log(`- Evidence valid: ${summary.evidenceValid}/${summary.expected}`);
              console.log(`- Consistency valid: ${summary.consistencyValid}/${summary.expected}`);
              console.log(`- Relevance accuracy: ${metrics.relevanceAccuracy.correct}/${metrics.relevanceAccuracy.evaluated}`);
              console.log(`- Priority accuracy: ${metrics.priorityAccuracy.correct}/${metrics.priorityAccuracy.evaluated}`);
              console.log(`- Event stage accuracy: ${metrics.eventStageAccuracy.correct}/${metrics.eventStageAccuracy.evaluated}`);
            ' "$BATCH_RESULT_DIR/evaluation.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload batch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-8b-${{ github.event.inputs.scope || 'smoke' }}-${{ github.event.inputs.knowledge_mode || 'baseline' }}-${{ github.run_id }}-${{ matrix.batchId }}
          path: ${{ env.BATCH_RESULT_DIR }}/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs:
      - plan
      - evaluate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGGREGATE_DIR: experiments/qwen-news-semantic-eval/results/8b-${{ github.event.inputs.scope || 'smoke' }}-${{ github.event.inputs.knowledge_mode || 'baseline' }}/aggregate
      DOWNLOAD_DIR: experiments/qwen-news-semantic-eval/results/downloaded-batches
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download batch diagnostics
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: qwen3-8b-${{ github.event.inputs.scope || 'smoke' }}-${{ github.event.inputs.knowledge_mode || 'baseline' }}-${{ github.run_id }}-*
          path: ${{ env.DOWNLOAD_DIR }}

      - name: Merge and evaluate all selected cases
        id: aggregate
        continue-on-error: true
        env:
          INPUT_ROOT: ${{ env.DOWNLOAD_DIR }}
          RESULT_PATH: ${{ env.AGGREGATE_DIR }}/model-output.json
          EVALUATION_PATH: ${{ env.AGGREGATE_DIR }}/evaluation.json
          CASE_IDS: ${{ needs.plan.outputs.case_ids }}
        run: |
          node experiments/qwen-news-semantic-eval/merge-results.mjs
          node experiments/qwen-news-semantic-eval/validate-results.mjs

      - name: Summarize aggregate evaluation
        if: always()
        continue-on-error: true
        run: |
          echo "## Qwen3-8B aggregate evaluation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: ${{ github.event.inputs.scope || 'smoke' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Knowledge mode: ${{ github.event.inputs.knowledge_mode || 'baseline' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected cases: ${{ needs.plan.outputs.case_count }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$AGGREGATE_DIR/evaluation.json" ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const { summary, metrics } = JSON.parse(fs.readFileSync(`${process.env.AGGREGATE_DIR}/evaluation.json`, "utf8"));
          const percent = (value) => value === null ? "N/A" : `${(value * 100).toFixed(1)}%`;
          console.log(`- Schema validity: ${percent(metrics.schemaValidity.rate)}`);
          console.log(`- Evidence validity: ${percent(metrics.evidenceValidity.rate)}`);
          console.log(`- Consistency validity: ${percent(metrics.consistencyValidity.rate)}`);
          console.log(`- Relevance accuracy: ${percent(metrics.relevanceAccuracy.rate)}`);
          console.log(`- Priority accuracy: ${percent(metrics.priorityAccuracy.rate)}`);
          console.log(`- Event stage accuracy: ${percent(metrics.eventStageAccuracy.rate)}`);
          console.log(`- Raw default precision / recall: ${percent(metrics.defaultVisible.rawModel.precision)} / ${percent(metrics.defaultVisible.rawModel.recall)}`);
          console.log(`- Constrained default precision / recall: ${percent(metrics.defaultVisible.constrained.precision)} / ${percent(metrics.defaultVisible.constrained.recall)}`);
          console.log(`- Total inference time: ${metrics.inferenceTiming.totalMs} ms`);
          console.log(`- Technical validation: ${summary.technicalValidationPassed ? "passed" : "failed"}`);
          NODE
          else
            echo "- Aggregate evaluation was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-8b-${{ github.event.inputs.scope || 'smoke' }}-${{ github.event.inputs.knowledge_mode || 'baseline' }}-${{ github.run_id }}-aggregate
          path: ${{ env.AGGREGATE_DIR }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when aggregate technical validation failed
        if: steps.aggregate.outcome == 'failure'
        run: exit 1

  compare-business-profile:
    needs:
      - plan
      - aggregate
    if: >-
      always() &&
      needs.aggregate.result == 'success' &&
      github.event.inputs.scope == 'full' &&
      github.event.inputs.knowledge_mode == 'business_profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASELINE_DIR: experiments/qwen-news-semantic-eval/results/profile-ab/baseline
      PROFILE_DIR: experiments/qwen-news-semantic-eval/results/profile-ab/business-profile
      COMPARISON_DIR: experiments/qwen-news-semantic-eval/results/profile-ab/comparison
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download current business-profile aggregate
        uses: actions/download-artifact@v4
        with:
          name: qwen3-8b-full-business_profile-${{ github.run_id }}-aggregate
          path: ${{ env.PROFILE_DIR }}

      - name: Prepare and evaluate historical baseline
        env:
          RESULT_PATH: ${{ env.BASELINE_DIR }}/model-output.json
          EVALUATION_PATH: ${{ env.BASELINE_DIR }}/evaluation.json
          MODEL: ${{ env.MODEL_ID }}
        run: |
          node experiments/qwen-news-semantic-eval/prepare-historical-baseline.mjs
          node experiments/qwen-news-semantic-eval/validate-results.mjs

      - name: Compare baseline and business-profile results
        env:
          BASELINE_EVALUATION_PATH: ${{ env.BASELINE_DIR }}/evaluation.json
          PROFILE_EVALUATION_PATH: ${{ env.PROFILE_DIR }}/evaluation.json
          COMPARISON_OUTPUT_PATH: ${{ env.COMPARISON_DIR }}/comparison.json
        run: node experiments/qwen-news-semantic-eval/compare-business-profile-ab.mjs

      - name: Summarize A/B comparison
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(`${process.env.COMPARISON_DIR}/comparison.json`, "utf8"));
          const pct = (value) => value === null ? "N/A" : `${(value * 100).toFixed(1)}%`;
          console.log("## Qwen3-8B Luxshare Business Profile A/B");
          console.log(`- Historical A run: ${process.env.BASELINE_RUN_ID}`);
          for (const [name, metrics] of Object.entries(report.metrics)) {
            console.log(`- ${name} relevance / priority / stage: ${pct(metrics.relevanceAccuracy.rate)} / ${pct(metrics.priorityAccuracy.rate)} / ${pct(metrics.eventStageAccuracy.rate)}`);
            console.log(`- ${name} constrained default precision / recall: ${pct(metrics.defaultVisible.constrained.precision)} / ${pct(metrics.defaultVisible.constrained.recall)}`);
          }
          console.log(`- Focus cases recorded: ${report.focusCases.map((item) => item.id).join(", ")}`);
          NODE

      - name: Upload A/B comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-8b-business-profile-ab-${{ github.run_id }}
          path: experiments/qwen-news-semantic-eval/results/profile-ab/
          if-no-files-found: error
          retention-days: 14
